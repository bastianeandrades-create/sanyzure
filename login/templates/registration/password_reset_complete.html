{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Cambiada - Sanyzure</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <main class="login-container">
        <div class="logo-container">
            <img src="{% static 'img/logo.png' %}" alt="Logo de Sanyzure" class="logo-login">
        </div>
        <h1 class="titulo-principal">¡Éxito!</h1>
        <p class="instruccion" style="font-weight: 600; color: #3d8b3d;">
            Su contraseña ha sido cambiada correctamente.
        </p>

        <div class="opciones-secundarias" style="border: none; padding-top: 0;">
            <a href="{% url 'login' %}" class="btn btn-ingresar" style="font-size: 1.5rem; padding: 18px;">
                Ir a la página de ingreso
            </a>
        </div>
    </main>
</body>
</html>
