{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisar Correo - Sanyzure</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <main class="login-container">
        <div class="logo-container">
            <img src="{% static 'img/logo.png' %}" alt="Logo de Sanyzure" class="logo-login">
        </div>
        <h1 class="titulo-principal">¡Email enviado!</h1>
        <p class="instruccion" style="font-weight: 600; color: #3d8b3d;">
            Le hemos enviado un correo con las instrucciones para reiniciar su contraseña.
        </p>
        <p class="instruccion">
            Por favor, revise su bandeja de entrada (y la carpeta de spam).
        </p>

        <div class="opciones-secundarias" style="border: none; padding-top: 0;">
            <a href="{% url 'login' %}" class="btn btn-ingresar" style="font-size: 1.5rem; padding: 18px;">
                Volver a la página de ingreso
            </a>
        </div>
    </main>
</body>
</html>
