{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reiniciar Contraseña - Sanyzure</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <main class="login-container">
        <div class="logo-container">
            <img src="{% static 'img/logo.png' %}" alt="Logo de Sanyzure" class="logo-login">
        </div>
        <h1 class="titulo-principal">¿Olvidó su contraseña?</h1>
        <p class="instruccion">Escriba su correo electrónico abajo y le enviaremos un link para recuperarla.</p>

        <form method="post">
            {% csrf_token %}
            
            <div class="campo-form">
                <label for="{{ form.email.id_for_label }}">
                    Su correo electrónico
                </label>
                {{ form.email }}
            </div>
            
            <button type="submit" class="btn btn-ingresar">
                Enviar link de recuperación
            </button>
        </form>

        <div class="opciones-secundarias">
            <a href="{% url 'login' %}" class="link-opcion">
                Volver a la página de ingreso
            </a>
        </div>
    </main>
</body>
</html>
